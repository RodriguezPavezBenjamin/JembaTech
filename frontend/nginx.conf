map $request_method $safe_method {
  default OTHER;
  GET GET;
  POST POST;
  PUT PUT;
  PATCH PATCH;
  DELETE DELETE;
  OPTIONS OPTIONS;
  HEAD HEAD;
}
log_format jemba_json escape=json '{"timestamp":"$time_iso8601","service":"jemba-web","event":"http_request","method":"$safe_method","status":$status,"durationSeconds":$request_time,"requestId":"$upstream_http_x_request_id"}';
# El entrypoint oficial sustituye solo las variables de despliegue autorizadas.
# Usar el DNS del contenedor permite seguir cambios de IP en Compose y Railway.
upstream jemba_api {
  zone jemba_api 64k;
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
  resolver_timeout 5s;
  server ${BACKEND_HOST}:${BACKEND_PORT} resolve;
}
server {
  access_log /var/log/nginx/access.log jemba_json;
  # Fallos HTTP/upstream se observan por status en el log JSON sin URI/query.
  error_log /var/log/nginx/error.log crit;
  listen ${PORT};
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://jemba_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / { try_files $uri $uri/ /index.html; }
}
