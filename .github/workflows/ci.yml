name: CI EP1
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: npm,
            cache-dependency-path: backend/package-lock.json,
          }
      - run: npm ci
      - run: npm run lint
      - run: npx prisma generate
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical
  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: python-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Analizar secretos expuestos
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: "1.16.4" }
      - run: terraform init -backend=false
      - run: terraform fmt -check
      - run: terraform validate
      - run: terraform plan -input=false -var-file=terraform.tfvars.example
  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend, python, secrets, terraform]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Construir servicios y probar integración NestJS-FastAPI
        shell: bash
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          docker compose build
          docker compose up -d database python-service migrate backend frontend
          node --test tests/integration/builds.test.mjs
      - name: Detener el ambiente temporal de CI
        if: always()
        run: JWT_SECRET="$(openssl rand -hex 32)" docker compose stop
